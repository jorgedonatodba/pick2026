apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: redis-giropops-senha
  name: redis-giropops-senha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-giropops-senha
  template:
    metadata:
      labels:
        app: redis-giropops-senha
    spec:
      containers:
      - image: redis:6-alpine
        name: redis
        resources:
          limits:
            cpu: "0.5"
            memory: 256Mi
          requests:
            cpu: 0.25
            memory: 128Mi
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10  
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        ports: 
        - containerPort: 6379
        volumeMounts:
        - name: giropops
          mountPath: /data
          readOnly: false
      volumes:
      - name: giropops
        hostPath: 
          path: /giropops/senha/redis/data

---

apiVersion: v1
kind: Service
metadata:
  labels:
    app: redis-giropops-senha
  name: redis-service
  namespace: default
spec:
  ports:
  - name: https
    port: 6379
    protocol: TCP
    targetPort: 6379
  type: ClusterIP
