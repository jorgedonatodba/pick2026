apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: giropops-senha
  name: giropops-senha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: giropops-senha
  strategy: 
    # type: Recreate
    type: RollingUpdate
    rollingUpdate: 
      maxSurge: 3
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: giropops-senha
    spec:
      containers:
      - image: linuxtips/giropops-senhas:1.0
        name: gipopos-senha
        ports:
        - containerPort: 5000
          hostPort: 5000
        resources:
          limits:
            cpu: "0.5"
            memory: 256Mi
          requests:
            cpu: 0.25
            memory: 128Mi
        # livenessProbe:
        #   httpGet:
        #     path: /
        #     port: 5000
        #   #tcpSocket:
        #     #port: 81
        #   initialDelaySeconds: 10
        #   periodSeconds: 10
        #   timeoutSeconds: 5
        #   failureThreshold: 3
        # readinessProbe:
        #   httpGet:
        #     path: /
        #     port: 5000
        #   initialDelaySeconds: 10  
        #   periodSeconds: 10
        #   timeoutSeconds: 5
        #   failureThreshold: 3
        #   successThreshold: 1
        # startupProbe:
        #   tcpSocket:
        #     port: 5000
        #   initialDelaySeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.universe.tf/address-pool: metallb-pool
  name: giropops-senha-service
spec:
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
  selector:
    app: giropops-senha
  type: LoadBalancer