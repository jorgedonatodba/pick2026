apiVersion: v1
kind: Pod
metadata:
  name: probed-app
  namespace: kube-system
spec:
  containers:
  - image: nginx:stable-alpine
    name: app
    ports:
    - containerPort: 80
    resources:
      limits:
        cpu: "0.5"
        memory: 256Mi
      requests:
        cpu: 0.25
        memory: 128Mi
    livenessProbe:
      httpGet:
        path: /healthz
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /ready
        port: 80       
      initialDelaySeconds: 10  
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    startupProbe:
      httpGet:
        port: 80
        path: /startup
      initialDelaySeconds: 10
      failureThreshold: 30