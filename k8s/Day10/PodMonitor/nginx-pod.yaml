apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx-pod
spec:
  containers:
  - name: nginx
    image: nginx
    ports:
    - containerPort: 80
      name: http
    volumeMounts:
    - name: nginx-config
      mountPath: /etc/nginx/conf.d/default.conf
      subPath: nginx.conf
  - name: nginx-exporter
    image: nginx/nginx-prometheus-exporter:edge
    args:
    - '-nginx.scrape-uri=http://localhost:80/metrics'
    ports:
    - containerPort: 9113
      name: metrics
    resources:
      limits:
        cpu: 1
        memory: 128Mi
      requests:
        cpu: 0.3
        memory: 64Mi
  volumes:
  - configMap:
      defaultMode: 420
      name: nginx-config
    name: nginx-config