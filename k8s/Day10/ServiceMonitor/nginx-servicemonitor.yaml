apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nginx-servicemonitor
  labels:
    release: prometheus
    app: nginx
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/instance: k8s
    app.kubernetes.io/name: giropops
    app.kubernetes.io/part-of: kube-giropops
spec:
  selector:
    matchLabels:
      app: nginx
  endpoints:
  - interval: 10s
    port: metrics
    path: /metrics
    targetPort: 9113

