deployments:
  giropops-senhas:
    name: giropops-senhas-helm
    image: linuxtips/giropops-senhas:1.0
    replicas: 3
    ports:
      - port: 5000
        targetPort: 5000
        name: giropops-senhas-port
        nodePort: 30000
        serviceType: NodePort
        protocol: TCP
      - port: 8088
        targetPort: 8088
        name: giropops-senhas-metrics
        serviceType: ClusterIP
        protocol: TCP
    labels:
      app: giropops-senhas
      env: labs
      live: "true"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
  redis:
    name: redis-helm
    image: redis
    labels:
      app: redis
      env: labs
      live: "true"
    replicas: 1
    ports:
      - port: 6379
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
services:
  giropops-senhas:
    ports:
      - port: 5000
        targetPort: 5000
        name: giropops-senhas-port
        nodePort: 30000
        serviceType: NodePort
        protocol: TCP
      - port: 8088
        targetPort: 8088
        name: giropops-senhas-metrics
        serviceType: ClusterIP
        protocol: TCP
    labels:
      app: giropops-senhas
      env: labs
      live: "true"        
  redis:
    ports:
      - port: 6379
        targetPort: 6379
        name: redis-service
        serviceType: ClusterIP
        protocol: TCP
    labels:
      app: redis
      env: labs
      live: "true"          
observability:
  giropops-senhas:
    logging: true
    matrics:
      enabled: true
      path: "/metrics"
databases:
  giropops-senhas:
    mysql:
      host: "mysql.svc.cluster.local"
      port: "3306"
      name: "MyDB"