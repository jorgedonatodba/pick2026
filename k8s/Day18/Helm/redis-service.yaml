apiVersion: v1
kind: Service
metadata:
  name: {{.Values.services.redis.name}}
spec:
  selector:
    app: {{.Values.deployments.redis.labels.app}}
  ports:
    - protocol: TCP
      port: {{.Values.services.redis.port}}
      targetPort: {{.Values.services.redis.targetPort}}
  type: {{.Values.services.redis.type}}